<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pour Sarah</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="images/favicon.png" />
  </head>

  <body>
    <!-- Audio : chanson de fond -->
    <audio id="chanson" src="audio/musique1.mp3" loop></audio>
    <!-- Audio : son qui passe une fois au choix -->
    <audio id="son-oui" src="audio/happy.mp3"></audio>
    <audio id="son-non" src="audio/roar.mp3"></audio>
    <audio id="son-paper" src="audio/paper.mp3"></audio>
    <audio id="son-hover" src="audio/hover.mp3"></audio>

    <div class="debut-container" id="debut-container">
      <p id="debut-img">Tu as receptionné un<br />nouveau courrier...</p>
    </div>

    <div class="enveloppe-container" id="enveloppe-container">
      <img id="enveloppe" src="images/enveloppe.png" />
    </div>

    <div class="lettre-container" id="lettre-container">
      <div class="lettre">
        <img id="lettre-img" src="images/lettre.png" />
      </div>
      <div id="texte-choix" class="texte-choix"></div>
      <div class="text-button">
        <img id="oui" src="images/oui.png" />
        <img id="non" src="images/non.png" />
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
